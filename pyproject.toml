[project]
name = "infrastructure"
version = "0.0.3"
description = ""
authors = [{ name = "Michael Gusek", email = "michael.gusek@web.de" }]
requires-python = ">=3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pulumi (>=3.219.0,<4.0.0)",
    "pulumi-tls (>=5.3.0,<6.0.0)",
    "pulumi-random (>=4.19.1,<5.0.0)",
    "pulumi-proxmoxve (>=7.12.0,<8.0.0)",
]

[tool.hatch.build.targets.sdist]
include = ["src/infrastructure"]

[tool.hatch.build.targets.wheel]
include = ["src/infrastructure"]

[tool.hatch.build.targets.wheel.sources]
"src/infrastructure" = "infrastructure"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
