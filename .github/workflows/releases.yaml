name: Release python package

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
          enable-cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v8.1.3
        with:
          extra_plugins: |
            @semantic-release/git
            @open_resources/semantic-release-uv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_USERNAME: pypi
          PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
