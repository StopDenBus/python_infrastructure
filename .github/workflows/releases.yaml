name: Release python package

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
          enable-cache: false
      # semantic-release-uv ruft uv in prepare/publish fest über ~/.local/bin/uv auf.
      - name: Link uv to ~/.local/bin
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(which uv)" "$HOME/.local/bin/uv"
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v8.1.3
        with:
          skip_npm_plugin: true
          extra_plugins: |
            @semantic-release/git
            @open_resources/semantic-release-uv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_USERNAME: pypi
          PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
